<svg width="680" height="160" viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#203a43"/>
      <stop offset="100%" style="stop-color:#2c5364"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a0c4ff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="160" fill="url(#bg)" rx="12"/>
  <g opacity="0.08" stroke="#58a6ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="680" y2="40"/>
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="340" y1="0" x2="340" y2="160"/>
    <line x1="480" y1="0" x2="480" y2="160"/>
    <line x1="600" y1="0" x2="600" y2="160"/>
  </g>
  <circle cx="60" cy="30" r="40" fill="#58a6ff" opacity="0.05"/>
  <circle cx="620" cy="130" r="50" fill="#a0c4ff" opacity="0.05"/>
