  </circle>
  <circle cx="580" cy="20" r="1.5" fill="#a0c4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M0,128 Q170,108 340,122 Q510,136 680,114 L680,160 L0,160 Z" fill="#0a1628" opacity="0.4"/>
  <text x="340" y="62" text-anchor="middle" font-family="monospace" font-size="32" font-weight="700" fill="url(#textgrad)" filter="url(#glow)">
