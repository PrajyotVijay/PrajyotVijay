  </circle>
  <circle cx="640" cy="80" r="2" fill="#a0c4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="145" r="1.5" fill="#58a6ff" opacity="0.5">
